plugins {
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'com.odevpedro.yugiohcollections'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

def nativeResourcesDir = file('src/main/resources/native')
def osName = System.getProperty('os.name').toLowerCase()
def libName = osName.contains('win') ? 'ocgcore.dll'
           : osName.contains('mac') ? 'libocgcore.dylib'
           : 'libocgcore.so'

task buildNative(type: Exec) {
    description = 'Build the native ocgcore JNI bridge library via CMake'
    workingDir = file('native/ocgcore-bridge')
    commandLine 'cmake', '--build', 'build', '--config', 'Release', '--parallel'
    doFirst {
        if (!file('native/ocgcore-bridge/build').exists()) {
            throw new GradleException(
                'Build directory not found. Run cmake first:\n' +
                '  cd native/ocgcore-bridge && cmake -B build -DCMAKE_BUILD_TYPE=Release'
            )
        }
    }
}

task configureNative(type: Exec) {
    description = 'Configure CMake for the ocgcore JNI bridge'
    workingDir = file('native/ocgcore-bridge')
    commandLine 'cmake', '-B', 'build', '-DCMAKE_BUILD_TYPE=Release'
}

task copyNativeLib(type: Copy) {
    description = 'Copy the compiled native library into resources'
    dependsOn buildNative
    from("native/ocgcore-bridge/build") {
        include libName
    }
    into nativeResourcesDir
}

task fullBuildNative {
    description = 'Configure, build and copy the ocgcore JNI bridge'
    dependsOn configureNative, copyNativeLib
}

task localBuild {
    group = 'development'
    description = 'Compile local application classes without tests or packaging'
    dependsOn classes
}

bootJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(nativeResourcesDir) {
        into 'BOOT-INF/classes/native'
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.flywaydb:flyway-core'
    implementation 'com.h2database:h2'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
}
